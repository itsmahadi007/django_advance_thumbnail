name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · Django ${{ matrix.django }} · Pillow ${{ matrix.pillow }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Pillow (no Image.Resampling) on the oldest testable stack
          - { python: "3.9",  django: "3.2", pillow: "8.4" }
          - { python: "3.10", django: "4.2", pillow: "9.0" }
          - { python: "3.11", django: "4.2", pillow: "9.5" }
          - { python: "3.12", django: "5.2", pillow: "latest" }
          - { python: "3.13", django: "6.0", pillow: "latest" }
          - { python: "3.14", django: "latest", pillow: "latest" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.django }}" = "latest" ]; then DJ="Django"; else DJ="Django~=${{ matrix.django }}.0"; fi
          if [ "${{ matrix.pillow }}" = "latest" ]; then PIL="Pillow"; else PIL="Pillow~=${{ matrix.pillow }}.0"; fi
          pip install "$DJ" "$PIL" pytest pytest-django pytest-mock
      - name: Run tests
        run: python -m pytest -q
