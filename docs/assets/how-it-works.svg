<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How django_advance_thumbnail works</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C4B33"/>
      <stop offset="1" stop-color="#092E20"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FD6B0"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E8C77"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>

  <text x="48" y="58" fill="#FFFFFF" font-size="24" font-weight="700">How it works</text>
  <text x="48" y="86" fill="#A9CDBC" font-size="15">Every save runs one cheap check. Pillow only runs when something actually changed.</text>

  <!-- Step 1 -->
  <g transform="translate(48,130)">
    <rect width="200" height="150" rx="14" fill="#0F5A3E" stroke="#2E7D5B"/>
    <circle cx="28" cy="30" r="14" fill="#44B78B"/>
    <text x="28" y="35" fill="#092E20" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="52" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Model saved</text>
    <text x="20" y="74" fill="#D7EDE2" font-size="14">You upload or change</text>
    <text x="20" y="94" fill="#D7EDE2" font-size="14">the source image and</text>
    <text x="20" y="114" fill="#D7EDE2" font-size="14">call</text>
    <text x="52" y="114" fill="#8FD6B0" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">save()</text>
  </g>

  <line x1="252" y1="205" x2="290" y2="205" stroke="#8FD6B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(296,130)">
    <rect width="250" height="150" rx="14" fill="#0F5A3E" stroke="#2E7D5B"/>
    <circle cx="28" cy="30" r="14" fill="#44B78B"/>
    <text x="28" y="35" fill="#092E20" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="52" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Change check</text>
    <text x="20" y="70" fill="#D7EDE2" font-size="14">• source image changed</text>
    <text x="20" y="92" fill="#D7EDE2" font-size="14">• size or resize_method changed</text>
    <text x="20" y="114" fill="#D7EDE2" font-size="14">• thumbnail missing</text>
    <text x="20" y="136" fill="#D7EDE2" font-size="14">• force_regenerate=True</text>
  </g>

  <!-- No branch -->
  <line x1="421" y1="284" x2="421" y2="330" stroke="#5E8C77" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-dim)"/>
  <text x="432" y="312" fill="#A9CDBC" font-size="13">none true</text>
  <g transform="translate(316,336)">
    <rect width="210" height="56" rx="12" fill="none" stroke="#5E8C77" stroke-dasharray="5 5"/>
    <text x="105" y="25" fill="#D7EDE2" font-size="15" font-weight="600" text-anchor="middle">Skip</text>
    <text x="105" y="44" fill="#A9CDBC" font-size="13" text-anchor="middle">no image work, no extra write</text>
  </g>

  <line x1="550" y1="205" x2="588" y2="205" stroke="#8FD6B0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="569" y="194" fill="#A9CDBC" font-size="13" text-anchor="middle">any</text>

  <!-- Step 3 -->
  <g transform="translate(594,130)">
    <rect width="270" height="150" rx="14" fill="#0F5A3E" stroke="#2E7D5B"/>
    <circle cx="28" cy="30" r="14" fill="#44B78B"/>
    <text x="28" y="35" fill="#092E20" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="52" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Render with Pillow</text>
    <text x="20" y="70" fill="#D7EDE2" font-size="14">• fix rotation from EXIF</text>
    <text x="20" y="92" fill="#D7EDE2" font-size="14">• resize: fit or fill (LANCZOS)</text>
    <text x="20" y="114" fill="#D7EDE2" font-size="14">• keep format: JPEG / PNG / WebP</text>
    <text x="20" y="136" fill="#D7EDE2" font-size="14">• quality 85, optimized</text>
  </g>

  <line x1="868" y1="205" x2="906" y2="205" stroke="#8FD6B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(912,130)">
    <rect width="240" height="150" rx="14" fill="#0F5A3E" stroke="#2E7D5B"/>
    <circle cx="28" cy="30" r="14" fill="#44B78B"/>
    <text x="28" y="35" fill="#092E20" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="52" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Thumbnail stored</text>
    <text x="20" y="72" fill="#8FD6B0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">photo_thumbnail.jpg</text>
    <text x="20" y="98" fill="#D7EDE2" font-size="14">written with</text>
    <text x="20" y="120" fill="#8FD6B0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">save(update_fields=[...])</text>
    <text x="20" y="140" fill="#A9CDBC" font-size="13">only the thumbnail column</text>
  </g>

  <!-- Footnote -->
  <text x="1152" y="410" fill="#A9CDBC" font-size="13" text-anchor="end">Source image cleared → thumbnail file is deleted too</text>
</svg>
